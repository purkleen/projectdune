<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lenin Jump 64</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --border: #7869C4;  /* C64 light blue */
    --screen: #40318D;  /* C64 blue */
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--border);
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: var(--screen);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }
</style>
</head>
<body>
<canvas id="c" width="320" height="200"></canvas>
<script>
(() => {
  'use strict';

  // ---- C64 palette (Pepto) ----
  const C = {
    black: '#000000', white: '#FFFFFF', red: '#883932', cyan: '#67B6BD',
    purple: '#8B3F96', green: '#55A049', blue: '#40318D', yellow: '#BFCE72',
    orange: '#8B5429', brown: '#574200', lred: '#B86962', dgrey: '#505050',
    grey: '#787878', lgreen: '#94E089', lblue: '#7869C4', lgrey: '#9F9F9F'
  };

  const W = 320, H = 200, GROUND = 172;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // Scale canvas to fit window with integer-ish scaling and a C64 "border"
  function resize() {
    const s = Math.max(1, Math.floor(Math.min(innerWidth / (W + 32), innerHeight / (H + 32)) * 2) / 2);
    canvas.style.width = W * s + 'px';
    canvas.style.height = H * s + 'px';
  }
  addEventListener('resize', resize);
  resize();

  // ---- Sprites ----
  // K black, S skin, H hair, B suit, R red, W white, Y yellow, D dark grey
  const PAL = { N: C.orange, M: C.black, O: C.brown, V: C.green, K: C.black, S: C.lred, H: C.orange, B: C.dgrey, R: C.red, W: C.white, Y: C.yellow, D: C.grey, G: C.lgrey };

  const leninTop = [
    '....KKKK....',
    '...KSSSSK...',
    '..KSSSSSSK..',
    '.KHSSSSSSHK.',
    '.KHSKSSKSHK.',
    '..KSSSSSSK..',
    '..KSKKKKSK..',
    '...KHHHHK...',
    '....KHHK....',
    '.....KK.....',
    '...BBWRWBB..',
    '..BBBBRBBBB.',
    '.BBBBBRBBBBB',
    '.SBBBBBBBBS.',
    '..BBBBBBBB..',
  ];
  const leninRunA = leninTop.concat([
    '..BBB..BBB..',
    '.BBB....BBB.',
    'KKK......KKK',
  ]);
  const leninRunB = leninTop.concat([
    '...BBBBBB...',
    '....BBBB....',
    '...KKKKKK...',
  ]);
  const leninJump = leninTop.concat([
    '..BBB..BBB..',
    '..BB....BB..',
    '..KK....KK..',
  ]);
  const leninDead = [
    '....KKKK....',
    '...KSSSSK...',
    '..KSSSSSSK..',
    '.KHSSSSSSHK.',
    '.KHKWKKWKHK.',
    '..KSKSSKSK..',
    '..KSKKKKSK..',
    '...KHHHHK...',
    '....KHHK....',
    '.....KK.....',
    '...BBWRWBB..',
    'S.BBBBRBBBB.S',
    '.BBBBBRBBBBB',
    '..BBBBBBBB..',
    '..BBBBBBBB..',
    '..BBB..BBB..',
    '..BB....BB..',
    '..KK....KK..',
  ];

  const hammerSickle = [
    '.......YYY...',
    '.........YY..',
    '.YYY......YY.',
    '.YYYY.....YY.',
    '..YYYY....YY.',
    '....YYY..YY..',
    '.....YYYYY...',
    '......YYY....',
    '.....YY.YY...',
    '...YYY...YY..',
    '.YYY......YY.',
    'YY.........Y.',
    'Y............',
  ];

  const bolTop = [
    '.....KK.....',
    '....KVVK....',
    '...KVVVVK...',
    '..KVVRRVVK.G',
    '..KVVRRVVK.G',
    '..KKKKKKKK.G',
    '..KSSSSSSK.O',
    '..KSKSSKSK.O',
    '..KSSSSSSK.O',
    '...KSSSSK..O',
    '..VVVVVVVV.O',
    '.VVVVVVVVVSO',
    '.VVVRVVVVV.O',
    '.VVVVVVVVV.O',
    '.VVVVVVVVV..',
  ];
  const bolA = bolTop.concat([
    '..VVV..VVV..',
    '.VVV....VV..',
    'KKK.....KKK.',
  ]);
  const bolB = bolTop.concat([
    '...VVVVVV...',
    '....VVVV....',
    '...KKKKK....',
  ]);

  // Horse, facing right (N body, M mane/tail)
  const horseTop = [
    '..............NN....',
    '.............MNNN...',
    '............MMNNNN..',
    '...........MMNNNNNN.',
    '...........MNNNKNNNN',
    '...........MNNNNNNNN',
    '..NNNNNNNNNMNNN.....',
    '.MNNNNNNNNNNNNN.....',
    'M.NNNNNNNNNNNNN.....',
    'M.NNNNNNNNNNNNN.....',
  ];
  const horseA = horseTop.concat([
    'M..NNN.....NNN......',
    '...NN.......NN......',
    '...NN.......NN......',
    '...KK.......KK......',
  ]);
  const horseB = horseTop.concat([
    '..NNN.......NNN.....',
    '..N.N......N..N.....',
    '.N...N....N....N....',
    'K.....K..K......K...',
  ]);
  const horseDead = horseA.slice().reverse();

  const star = [
    '....R....',
    '...RRR...',
    'RRRRRRRRR',
    '.RRRRRRR.',
    '..RRRRR..',
    '.RRR.RRR.',
    'RR.....RR',
  ];

  // Pre-render a sprite with a 1-pixel black outline at a given scale
  function makeSprite(rows, scale, outline = true) {
    const w = Math.max(...rows.map(r => r.length)), h = rows.length;
    const pad = outline ? 1 : 0;
    const cv = document.createElement('canvas');
    cv.width = (w + pad * 2) * scale;
    cv.height = (h + pad * 2) * scale;
    const g = cv.getContext('2d');
    const solid = (x, y) => y >= 0 && y < h && x >= 0 && rows[y][x] && rows[y][x] !== '.';
    if (outline) {
      g.fillStyle = C.black;
      for (let y = -1; y <= h; y++)
        for (let x = -1; x <= w; x++)
          if (!solid(x, y) && (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1)))
            g.fillRect((x + pad) * scale, (y + pad) * scale, scale, scale);
    }
    for (let y = 0; y < h; y++)
      for (let x = 0; x < rows[y].length; x++) {
        const ch = rows[y][x];
        if (ch === '.') continue;
        g.fillStyle = PAL[ch];
        g.fillRect((x + pad) * scale, (y + pad) * scale, scale, scale);
      }
    return cv;
  }

  const SPR = {
    runA: makeSprite(leninRunA, 2, false),
    runB: makeSprite(leninRunB, 2, false),
    jump: makeSprite(leninJump, 2, false),
    dead: makeSprite(leninDead, 2, false),
    hsSmall: makeSprite(hammerSickle, 2),
    hsBig: makeSprite(hammerSickle, 3),
    star: makeSprite(star, 2),
    starIcon: makeSprite(star, 1),
    leninRide: makeSprite(leninTop, 2, false),
    horseA: makeSprite(horseA, 2),
    horseB: makeSprite(horseB, 2),
    horseDead: makeSprite(horseDead, 2),
    bolA: makeSprite(bolA, 2),
    bolB: makeSprite(bolB, 2),
  };

  // ---- Sound: SID-ish square waves ----
  let actx = null;
  function audio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(f1, f2, dur, type = 'square', vol = 0.08, delay = 0) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), gn = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    gn.gain.setValueAtTime(vol, t);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    jump: () => tone(220, 880, 0.15),
    point: () => { tone(660, 660, 0.08); tone(990, 990, 0.12, 'square', 0.08, 0.09); },
    mount: () => [392, 523, 659, 784].forEach((f, i) => tone(f, f, 0.08, 'square', 0.07, i * 0.06)),
    neigh: () => { tone(900, 500, 0.12, 'sawtooth', 0.07); tone(800, 300, 0.25, 'sawtooth', 0.07, 0.12); tone(200, 50, 0.3, 'triangle', 0.12, 0.35); },
    coin: () => { tone(988, 988, 0.05, 'square', 0.07); tone(1319, 1319, 0.14, 'square', 0.07, 0.05); },
    die: () => { tone(440, 55, 0.6, 'sawtooth', 0.1); tone(300, 40, 0.6, 'square', 0.06, 0.05); },
  };

  // ---- Persistent hi-score (best effort) ----
  let hi = 0;
  try { hi = parseInt(localStorage.getItem('lenin64-hi') || '0', 10) || 0; } catch (e) {}
  function saveHi() { try { localStorage.setItem('lenin64-hi', String(hi)); } catch (e) {} }

  // ---- Background: factory skyline ----
  const skyline = [];
  (function genSkyline() {
    let x = 0;
    while (x < W * 2) {
      const w = 14 + Math.floor(Math.random() * 30);
      const h = 10 + Math.floor(Math.random() * 30);
      const chimney = Math.random() < 0.5 ? { off: 2 + Math.floor(Math.random() * (w - 6)), h: 8 + Math.floor(Math.random() * 14) } : null;
      skyline.push({ x, w, h, chimney });
      x += w + Math.floor(Math.random() * 6);
    }
  })();
  const SKY_W = skyline[skyline.length - 1].x + skyline[skyline.length - 1].w + 4;

  const groundBits = Array.from({ length: 40 }, () => ({
    x: Math.random() * W, y: GROUND + 4 + Math.floor(Math.random() * 20), w: 1 + Math.floor(Math.random() * 3)
  }));

  // ---- Game state ----
  const STATE = { TITLE: 0, PLAY: 1, OVER: 2 };
  let state = STATE.TITLE;
  let player, obstacles, stars, popups, horses, corpses, starCount, speed, score, nextSpawn, skyOff, frame, flash, overTimer, blink;

  function reset() {
    player = { x: 28, y: GROUND - 36, vy: 0, w: 24, h: 36, onGround: true, riding: false, invuln: 0 };
    horses = [];
    corpses = [];
    obstacles = [];
    stars = [];
    popups = [];
    starCount = 0;
    speed = 3.6;
    score = 0;
    nextSpawn = 80;
    skyOff = 0;
    frame = 0;
    flash = 0;
  }
  reset();

  // Horse riding changes Lenin's size; keep his feet where they are
  function setRiding(on) {
    const bottom = player.y + player.h;
    player.riding = on;
    player.w = on ? 44 : 24;
    player.h = on ? 42 : 36;
    player.y = bottom - player.h;
  }

  function addStar(x, y) {
    stars.push({ x, y, w: 22, h: 18, t: Math.random() * 60 });
  }

  const HORSE_SCORE = 150;
  function spawn() {
    const r = Math.random();
    const x0 = W + 10;
    let width = 30, height = 30;
    if (score > 100 && r < 0.28) {
      // Marching Bolshevik(s), walking toward Lenin
      const n = score > 400 && Math.random() < 0.35 ? 2 : 1;
      for (let i = 0; i < n; i++)
        obstacles.push({ type: 'bol', x: x0 + i * 30, y: GROUND - 40, w: 28, h: 40, t: Math.random() * 12 });
      width = n * 30; height = 40;
    } else if (r < 0.6) {
      obstacles.push({ type: 'hs', x: x0, y: GROUND - 30, w: 30, h: 30, spr: SPR.hsSmall });
    } else if (r < 0.82) {
      const n = score > 150 ? 2 + (Math.random() < 0.4 ? 1 : 0) : 2;
      for (let i = 0; i < n; i++)
        obstacles.push({ type: 'hs', x: x0 + i * 26, y: GROUND - 30, w: 30, h: 30, spr: SPR.hsSmall });
      width = n * 26 + 4;
    } else {
      obstacles.push({ type: 'hs', x: x0, y: GROUND - 45, w: 45, h: 45, spr: SPR.hsBig });
      width = 45; height = 45;
    }
    // Red star floating above the obstacle: grab it mid-jump
    if (Math.random() < 0.4) addStar(x0 + width / 2 - 11, GROUND - height - 34);

    const minGap = 110 + speed * 14;
    nextSpawn = minGap + Math.random() * 160;
    // Red star on the ground in the gap before the next obstacle
    const gapMid = x0 + width + nextSpawn * 0.5;
    if (!player.riding && horses.length === 0 && score > HORSE_SCORE && Math.random() < 0.2) {
      // A riderless horse waits in the gap: run into it to mount
      horses.push({ x: gapMid - 22, y: GROUND - 32, w: 44, h: 32, t: 0 });
    } else if (Math.random() < 0.35) addStar(gapMid, GROUND - 22);
  }

  // ---- Input ----
  let holding = false;
  function press() {
    audio();
    if (state === STATE.TITLE) { reset(); state = STATE.PLAY; return; }
    if (state === STATE.OVER) { if (overTimer > 25) { reset(); state = STATE.PLAY; } return; }
    holding = true;
    if (player.onGround) {
      player.vy = -8.6;
      player.onGround = false;
      sfx.jump();
    }
  }
  function release() {
    holding = false;
    if (state === STATE.PLAY && player.vy < -3.5) player.vy = -3.5; // short hop
  }
  addEventListener('keydown', e => {
    if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) {
      e.preventDefault();
      if (!e.repeat) press();
    }
  });
  addEventListener('keyup', e => {
    if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) release();
  });
  addEventListener('pointerdown', e => { e.preventDefault(); press(); });
  addEventListener('pointerup', release);
  addEventListener('pointercancel', release);

  // ---- Update ----
  function hit(a, b) {
    // Forgiving hitboxes
    return a.x + 5 < b.x + b.w - 6 && a.x + a.w - 5 > b.x + 6 &&
           a.y + 4 < b.y + b.h - 4 && a.y + a.h - 2 > b.y + 6;
  }

  function update(dt) {
    blink += dt;
    if (state === STATE.OVER) { overTimer += dt; return; }
    if (state !== STATE.PLAY) return;
    frame += dt;

    speed = Math.min(9.5, speed + 0.0016 * dt);
    const move = speed * dt;

    // player physics
    if (!player.onGround) {
      player.vy += (holding && player.vy < 0 ? 0.42 : 0.62) * dt;
      player.y += player.vy * dt;
      if (player.y >= GROUND - player.h) {
        player.y = GROUND - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }

    // world scroll
    skyOff = (skyOff + move * 0.25) % SKY_W;
    for (const g of groundBits) {
      g.x -= move;
      if (g.x < -4) { g.x = W + Math.random() * 20; g.y = GROUND + 4 + Math.floor(Math.random() * 20); }
    }

    nextSpawn -= move;
    if (nextSpawn <= 0) spawn();

    for (const o of obstacles) {
      o.x -= move * (o.type === 'bol' ? 1.12 : 1);
      if (o.type === 'bol') o.t += dt;
    }
    obstacles = obstacles.filter(o => o.x + o.w > -10);

    // red stars: collect for bonus points
    for (const st of stars) {
      st.x -= move;
      st.t += dt;
      if (!st.got && player.x + 2 < st.x + st.w && player.x + player.w - 2 > st.x &&
          player.y < st.y + st.h && player.y + player.h > st.y) {
        st.got = true;
        starCount++;
        score += 25;
        sfx.coin();
        popups.push({ x: st.x + 11, y: st.y, t: 0 });
      }
    }
    stars = stars.filter(st => !st.got && st.x + st.w > -10);
    for (const pp of popups) { pp.t += dt; pp.y -= 0.5 * dt; }
    popups = popups.filter(pp => pp.t < 40);

    for (const hs of horses) {
      hs.x -= move;
      hs.t += dt;
      if (!player.riding && hit(player, hs)) {
        hs.taken = true;
        setRiding(true);
        sfx.mount();
        popups.push({ x: hs.x + 22, y: hs.y - 6, t: 0, label: 'HORSE!' });
      }
    }
    horses = horses.filter(hs => !hs.taken && hs.x + hs.w > -10);
    for (const c of corpses) c.x -= move;
    corpses = corpses.filter(c => c.x > -50);
    if (player.invuln > 0) player.invuln -= dt;

    for (const o of obstacles) {
      if (player.invuln > 0 || !hit(player, o)) continue;
      if (player.riding) {
        // The horse takes the hit: it dies, the obstacle is crushed, Lenin keeps going
        o.crushed = true;
        corpses.push({ x: player.x, y: GROUND - 30 });
        setRiding(false);
        player.vy = -6;
        player.onGround = false;
        player.invuln = 70;
        sfx.neigh();
        popups.push({ x: player.x + 30, y: GROUND - 36, t: 0, label: 'RIP HORSE' });
        continue;
      }
      {
        state = STATE.OVER;
        overTimer = 0;
        if (Math.floor(score) > hi) { hi = Math.floor(score); saveHi(); }
        sfx.die();
        return;
      }
    }
    obstacles = obstacles.filter(o => !o.crushed);

    const before = Math.floor(score / 100);
    score += 0.18 * dt * (speed / 3.6);
    if (Math.floor(score / 100) > before) { sfx.point(); flash = 40; }
    if (flash > 0) flash -= dt;
  }

  // ---- Draw ----
  function text(str, x, y, color = C.lblue, align = 'left') {
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.fillText(str, x, y);
  }
  const pad5 = n => String(Math.floor(n)).padStart(5, '0');

  function drawWorld() {
    ctx.fillStyle = C.blue;
    ctx.fillRect(0, 0, W, H);

    // big pale moon
    ctx.fillStyle = '#5848A8';
    ctx.fillRect(250, 30, 24, 24);
    ctx.fillRect(246, 34, 32, 16);
    ctx.fillRect(254, 26, 16, 32);

    // skyline (two copies for seamless wrap)
    ctx.fillStyle = '#5446A6';
    for (let k = 0; k < 2; k++) {
      for (const b of skyline) {
        const x = Math.floor(b.x - skyOff + k * SKY_W);
        if (x > W || x + b.w < 0) continue;
        ctx.fillRect(x, GROUND - b.h, b.w, b.h);
        if (b.chimney) ctx.fillRect(x + b.chimney.off, GROUND - b.h - b.chimney.h, 4, b.chimney.h);
      }
    }

    // ground
    ctx.fillStyle = C.lblue;
    ctx.fillRect(0, GROUND, W, 2);
    for (const g of groundBits) ctx.fillRect(Math.floor(g.x), g.y, g.w, 1);
  }

  function drawHorses() {
    for (const c of corpses) ctx.drawImage(SPR.horseDead, Math.floor(c.x), c.y);
    for (const hs of horses) {
      // grazing: head dips now and then
      const dip = Math.floor(hs.t / 25) % 3 === 0 ? 2 : 0;
      ctx.drawImage(SPR.horseA, Math.floor(hs.x), Math.floor(hs.y) + dip);
    }
  }

  function drawPlayer() {
    if (player.invuln > 0 && state === STATE.PLAY && Math.floor(player.invuln / 4) % 2) return;
    if (player.riding) {
      const gallop = state === STATE.PLAY && player.onGround ? Math.floor(frame / 5) % 2 : 0;
      const bounce = gallop ? 1 : 0;
      ctx.drawImage(gallop ? SPR.horseB : SPR.horseA, Math.floor(player.x), Math.floor(player.y) + 10);
      ctx.drawImage(SPR.leninRide, Math.floor(player.x) + 10, Math.floor(player.y) - bounce);
      return;
    }
    let spr;
    if (state === STATE.OVER) spr = SPR.dead;
    else if (!player.onGround) spr = SPR.jump;
    else if (state === STATE.PLAY) spr = Math.floor(frame / 6) % 2 ? SPR.runA : SPR.runB;
    else spr = SPR.runA;
    ctx.drawImage(spr, Math.floor(player.x), Math.floor(player.y));
  }

  function drawObstacles() {
    for (const o of obstacles) {
      const spr = o.type === 'bol' ? (Math.floor(o.t / 7) % 2 ? SPR.bolA : SPR.bolB) : o.spr;
      ctx.drawImage(spr, Math.floor(o.x), Math.floor(o.y));
    }
  }

  function drawStars() {
    for (const st of stars) {
      // twinkle: blink a white glint
      const bob = Math.round(Math.sin(st.t / 8) * 2);
      ctx.drawImage(SPR.star, Math.floor(st.x), Math.floor(st.y) + bob);
      if (Math.floor(st.t / 10) % 4 === 0) {
        ctx.fillStyle = C.white;
        ctx.fillRect(Math.floor(st.x) + 10, Math.floor(st.y) + bob + 4, 2, 2);
      }
    }
    for (const pp of popups) text(pp.label || '+25', Math.floor(pp.x), Math.floor(pp.y), pp.label === 'RIP HORSE' ? C.lgrey : C.yellow, 'center');
  }

  function drawHUD() {
    const showScore = !(flash > 0 && Math.floor(flash / 5) % 2);
    ctx.drawImage(SPR.starIcon, 8, 6);
    text('x' + starCount, 22, 14, C.white);
    text('HI ' + pad5(hi), 196, 14, C.lgrey, 'right');
    if (showScore) text(pad5(score), 312, 14, C.white, 'right');
  }

  function drawTitle() {
    text('**** PROLETARIAT 64 BASIC V2 ****', W / 2, 20, C.lblue, 'center');
    text('64K RAM SYSTEM  1917 BYTES FREE', W / 2, 34, C.lblue, 'center');
    text('READY.', 8, 54, C.lblue);
    text('LOAD "LENIN JUMP",8,1', 8, 66, C.lblue);
    text('LENIN JUMP', W / 2, 98, C.yellow, 'center');
    if (Math.floor(blink / 30) % 2 === 0)
      text('PRESS SPACE / TAP TO START', W / 2, 116, C.white, 'center');
    text('FIND A HORSE: IT TAKES ONE HIT', W / 2, 132, C.lgreen, 'center');
    text('JUMP HAMMERS & BOLSHEVIKS', W / 2, 184, C.lgrey, 'center');
    text('GRAB THE RED STARS: +25', W / 2, 196, C.lred, 'center');
  }

  function drawOver() {
    ctx.fillStyle = C.black;
    ctx.fillRect(56, 72, 208, 46);
    ctx.fillStyle = C.lblue;
    ctx.fillRect(56, 72, 208, 2); ctx.fillRect(56, 116, 208, 2);
    text('?REVOLUTION ERROR', W / 2, 88, C.red, 'center');
    text('IN LINE ' + Math.floor(score), W / 2, 100, C.lblue, 'center');
    if (overTimer > 25 && Math.floor(blink / 30) % 2 === 0)
      text('SPACE / TAP TO RETRY', W / 2, 112, C.white, 'center');
  }

  function draw() {
    ctx.font = '8px "Press Start 2P", monospace';
    ctx.textBaseline = 'alphabetic';
    drawWorld();
    drawHorses();
    drawObstacles();
    drawStars();
    drawPlayer();
    if (state !== STATE.TITLE) drawHUD();
    if (state === STATE.TITLE) drawTitle();
    if (state === STATE.OVER) drawOver();
  }

  // ---- Main loop (dt in 60fps frames) ----
  let last = performance.now();
  blink = 0; overTimer = 0;
  function loop(now) {
    const dt = Math.min(3, (now - last) / (1000 / 60));
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  const start = () => requestAnimationFrame(t => { last = t; loop(t); });
  if (document.fonts && document.fonts.load) {
    document.fonts.load('8px "Press Start 2P"').then(start, start);
  } else start();
})();
</script>
</body>
</html>
