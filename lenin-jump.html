<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lenin Jump 64</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --border: #7869C4;  /* C64 light blue */
    --screen: #40318D;  /* C64 blue */
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--border);
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: var(--screen);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }
</style>
</head>
<body>
<canvas id="c" width="320" height="200"></canvas>
<script>
(() => {
  'use strict';

  // ---- C64 palette (Pepto) ----
  const C = {
    black: '#000000', white: '#FFFFFF', red: '#883932', cyan: '#67B6BD',
    purple: '#8B3F96', green: '#55A049', blue: '#40318D', yellow: '#BFCE72',
    orange: '#8B5429', brown: '#574200', lred: '#B86962', dgrey: '#505050',
    grey: '#787878', lgreen: '#94E089', lblue: '#7869C4', lgrey: '#9F9F9F'
  };

  const W = 320, H = 200, GROUND = 172;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // Scale canvas to fit window with integer-ish scaling and a C64 "border"
  function resize() {
    const s = Math.max(1, Math.floor(Math.min(innerWidth / (W + 32), innerHeight / (H + 32)) * 2) / 2);
    canvas.style.width = W * s + 'px';
    canvas.style.height = H * s + 'px';
  }
  addEventListener('resize', resize);
  resize();

  // ---- Sprites ----
  // K black, S skin, H hair, B suit, R red, W white, Y yellow, D dark grey
  const PAL = { N: C.orange, M: C.black, O: C.brown, V: C.green, K: C.black, S: C.lred, H: C.orange, B: C.dgrey, R: C.red, W: C.white, Y: C.yellow, D: C.grey, G: C.lgrey };

  const leninTop = [
    '....KKKK....',
    '...KSSSSK...',
    '..KSSSSSSK..',
    '.KHSSSSSSHK.',
    '.KHSKSSKSHK.',
    '..KSSSSSSK..',
    '..KSKKKKSK..',
    '...KHHHHK...',
    '....KHHK....',
    '.....KK.....',
    '...BBWRWBB..',
    '..BBBBRBBBB.',
    '.BBBBBRBBBBB',
    '.SBBBBBBBBS.',
    '..BBBBBBBB..',
  ];
  const leninRunA = leninTop.concat([
    '..BBB..BBB..',
    '.BBB....BBB.',
    'KKK......KKK',
  ]);
  const leninRunB = leninTop.concat([
    '...BBBBBB...',
    '....BBBB....',
    '...KKKKKK...',
  ]);
  const leninJump = leninTop.concat([
    '..BBB..BBB..',
    '..BB....BB..',
    '..KK....KK..',
  ]);
  const leninDead = [
    '....KKKK....',
    '...KSSSSK...',
    '..KSSSSSSK..',
    '.KHSSSSSSHK.',
    '.KHKWKKWKHK.',
    '..KSKSSKSK..',
    '..KSKKKKSK..',
    '...KHHHHK...',
    '....KHHK....',
    '.....KK.....',
    '...BBWRWBB..',
    'S.BBBBRBBBB.S',
    '.BBBBBRBBBBB',
    '..BBBBBBBB..',
    '..BBBBBBBB..',
    '..BBB..BBB..',
    '..BB....BB..',
    '..KK....KK..',
  ];

  const hammerSickle = [
    '.......YYY...',
    '.........YY..',
    '.YYY......YY.',
    '.YYYY.....YY.',
    '..YYYY....YY.',
    '....YYY..YY..',
    '.....YYYYY...',
    '......YYY....',
    '.....YY.YY...',
    '...YYY...YY..',
    '.YYY......YY.',
    'YY.........Y.',
    'Y............',
  ];

  const bolTop = [
    '.....KK.....',
    '....KVVK....',
    '...KVVVVK...',
    '..KVVRRVVK.G',
    '..KVVRRVVK.G',
    '..KKKKKKKK.G',
    '..KSSSSSSK.O',
    '..KSKSSKSK.O',
    '..KSSSSSSK.O',
    '...KSSSSK..O',
    '..VVVVVVVV.O',
    '.VVVVVVVVVSO',
    '.VVVRVVVVV.O',
    '.VVVVVVVVV.O',
    '.VVVVVVVVV..',
  ];
  const bolA = bolTop.concat([
    '..VVV..VVV..',
    '.VVV....VV..',
    'KKK.....KKK.',
  ]);
  const bolB = bolTop.concat([
    '...VVVVVV...',
    '....VVVV....',
    '...KKKKK....',
  ]);
  // Aiming pose: rifle shouldered and pointed left at Lenin (4 extra columns on the left)
  const bolAim = bolA.map(r => '....' + r.slice(0, 11) + '.');
  bolAim[10] = 'GOOOOO' + bolAim[10].slice(6);
  bolAim[11] = bolAim[11].slice(0, 4) + 'S' + bolAim[11].slice(5);

  // Flattened Bolshevik after being stomped
  const bolSquash = [
    '.....VVV.....',
    '...VVVRRVV...',
    '.SVVVVVVVVVS.',
    'KKVVVVVVVVVKK',
  ];

  // Horse, facing right (N body, M mane/tail)
  const horseTop = [
    '..............NN....',
    '.............MNNN...',
    '............MMNNNN..',
    '...........MMNNNNNN.',
    '...........MNNNKNNNN',
    '...........MNNNNNNNN',
    '..NNNNNNNNNMNNN.....',
    '.MNNNNNNNNNNNNN.....',
    'M.NNNNNNNNNNNNN.....',
    'M.NNNNNNNNNNNNN.....',
  ];
  const horseA = horseTop.concat([
    'M..NNN.....NNN......',
    '...NN.......NN......',
    '...NN.......NN......',
    '...KK.......KK......',
  ]);
  const horseB = horseTop.concat([
    '..NNN.......NNN.....',
    '..N.N......N..N.....',
    '.N...N....N....N....',
    'K.....K..K......K...',
  ]);
  const horseDead = horseA.slice().reverse();

  const star = [
    '....R....',
    '...RRR...',
    'RRRRRRRRR',
    '.RRRRRRR.',
    '..RRRRR..',
    '.RRR.RRR.',
    'RR.....RR',
  ];

  // Pre-render a sprite with a 1-pixel black outline at a given scale
  function makeSprite(rows, scale, outline = true, outlineColor = C.black) {
    const w = Math.max(...rows.map(r => r.length)), h = rows.length;
    const pad = outline ? 1 : 0;
    const cv = document.createElement('canvas');
    cv.width = (w + pad * 2) * scale;
    cv.height = (h + pad * 2) * scale;
    const g = cv.getContext('2d');
    const solid = (x, y) => y >= 0 && y < h && x >= 0 && rows[y][x] && rows[y][x] !== '.';
    if (outline) {
      g.fillStyle = outlineColor;
      for (let y = -1; y <= h; y++)
        for (let x = -1; x <= w; x++)
          if (!solid(x, y) && (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1)))
            g.fillRect((x + pad) * scale, (y + pad) * scale, scale, scale);
    }
    for (let y = 0; y < h; y++)
      for (let x = 0; x < rows[y].length; x++) {
        const ch = rows[y][x];
        if (ch === '.') continue;
        g.fillStyle = PAL[ch];
        g.fillRect((x + pad) * scale, (y + pad) * scale, scale, scale);
      }
    return cv;
  }

  const SPR = {
    runA: makeSprite(leninRunA, 2, false),
    runB: makeSprite(leninRunB, 2, false),
    jump: makeSprite(leninJump, 2, false),
    dead: makeSprite(leninDead, 2, false),
    hsSmall: makeSprite(hammerSickle, 2),
    hsBig: makeSprite(hammerSickle, 3),
    star: makeSprite(star, 2, true, C.yellow),
    starIcon: makeSprite(star, 1, true, C.yellow),
    leninRide: makeSprite(leninTop, 2, false),
    horseA: makeSprite(horseA, 2),
    horseB: makeSprite(horseB, 2),
    horseDead: makeSprite(horseDead, 2),
    bolA: makeSprite(bolA, 2),
    bolB: makeSprite(bolB, 2),
    bolAim: makeSprite(bolAim, 2),
    bolSquash: makeSprite(bolSquash, 2),
  };

  // ---- Sound: SID-ish square waves ----
  let actx = null;
  function audio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function noise(dur, vol = 0.12) {
    const a = audio(); if (!a) return;
    const buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    const src = a.createBufferSource(), gn = a.createGain();
    src.buffer = buf; gn.gain.value = vol;
    src.connect(gn).connect(a.destination);
    src.start();
  }
  function tone(f1, f2, dur, type = 'square', vol = 0.08, delay = 0) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), gn = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    gn.gain.setValueAtTime(vol, t);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    jump: () => tone(220, 880, 0.15),
    point: () => { tone(660, 660, 0.08); tone(990, 990, 0.12, 'square', 0.08, 0.09); },
    mount: () => [392, 523, 659, 784].forEach((f, i) => tone(f, f, 0.08, 'square', 0.07, i * 0.06)),
    neigh: () => { tone(900, 500, 0.12, 'sawtooth', 0.07); tone(800, 300, 0.25, 'sawtooth', 0.07, 0.12); tone(200, 50, 0.3, 'triangle', 0.12, 0.35); },
    stomp: () => { tone(160, 40, 0.12, 'square', 0.12); tone(523, 1046, 0.12, 'square', 0.06, 0.08); },
    shot: () => { noise(0.25, 0.2); tone(180, 60, 0.15, 'square', 0.06); },
    fanfare: () => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, f, i === 5 ? 0.5 : 0.12, 'square', 0.08, i * 0.13)),
    coin: () => { tone(988, 988, 0.05, 'square', 0.07); tone(1319, 1319, 0.14, 'square', 0.07, 0.05); },
    die: () => { tone(440, 55, 0.6, 'sawtooth', 0.1); tone(300, 40, 0.6, 'square', 0.06, 0.05); },
  };

  // ---- Persistent hi-score (best effort) ----
  let hi = 0;
  try { hi = parseInt(localStorage.getItem('lenin64-hi') || '0', 10) || 0; } catch (e) {}
  function saveHi() { try { localStorage.setItem('lenin64-hi', String(hi)); } catch (e) {} }

  // ---- Background: Red Square (Kremlin wall, Spasskaya tower, Mausoleum, St Basil's) ----
  const BG_W = 640;
  const BG = document.createElement('canvas');
  BG.width = BG_W; BG.height = H;
  (function paintRedSquare() {
    const g = BG.getContext('2d');
    const rect = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
    const tri = (cx, top, base, halfW, c) => {      // pixel-stepped spire
      for (let y = top; y < base; y++) {
        const hw = Math.max(1, Math.round(halfW * (y - top) / (base - top)));
        rect(cx - hw, y, hw * 2, 1, c);
      }
    };
    const topStar = (cx, y) => g.drawImage(SPR.starIcon, cx - 5, y);
    const WALL = GROUND - 34;

    // Kremlin wall with swallowtail merlons and brick courses
    rect(0, WALL, BG_W, GROUND - WALL, C.red);
    for (let y = WALL + 5; y < GROUND; y += 6) rect(0, y, BG_W, 1, C.brown);
    for (let x = 2; x < BG_W; x += 12) {
      rect(x, WALL - 7, 7, 7, C.red);
      rect(x + 3, WALL - 7, 1, 3, C.blue);        // the swallowtail notch
      rect(x, WALL - 7, 7, 1, C.lred);
    }

    // a tower: stacked tiers, optional clock, green tent spire, red star
    function tower(cx, w, top, clock) {
      rect(cx - w / 2, top, w, GROUND - top, C.red);
      for (let y = top + 6; y < GROUND; y += 6) rect(cx - w / 2, y, w, 1, C.brown);
      rect(cx - w / 2 - 2, top, w + 4, 3, C.lred);                // cornice
      for (let x = cx - w / 2 + 3; x < cx + w / 2 - 3; x += 6) rect(x, top + 12, 2, 6, C.black); // windows
      const t2 = top - 16, w2 = w - 8;
      rect(cx - w2 / 2, t2, w2, 16, C.red);
      rect(cx - w2 / 2 - 1, t2, w2 + 2, 2, C.white);
      if (clock) {
        rect(cx - 5, t2 + 4, 10, 10, C.white);
        rect(cx - 3, t2 + 2, 6, 14, C.white);
        rect(cx - 7, t2 + 6, 14, 6, C.white);
        rect(cx, t2 + 5, 1, 4, C.black); rect(cx, t2 + 8, 4, 1, C.black);
      }
      const spireTop = t2 - (clock ? 34 : 24);
      tri(cx, spireTop, t2, w2 / 2 + 1, C.green);
      rect(cx, spireTop - 2, 1, 2, C.yellow);
      topStar(cx, spireTop - 10);
    }

    // Onion dome on a drum, with horizontal stripes
    const PROFILE = [1, 1, 2, 4, 6, 7, 7, 6, 4];
    function onion(cx, top, scale, c1, c2, drumBottom) {
      rect(cx - 3 * scale, top + PROFILE.length * 2, 6 * scale, drumBottom - top - PROFILE.length * 2, C.white);
      rect(cx - 3 * scale + 2, top + PROFILE.length * 2 + 3, 2, 4, C.black);
      PROFILE.forEach((hw, i) => {
        const w = Math.max(1, Math.round(hw * scale));
        rect(cx - w, top + i * 2, w * 2, 2, i % 2 ? c1 : c2);
      });
      rect(cx, top - 4, 1, 4, C.yellow);
    }

    tower(70, 30, 78, true);           // Spasskaya tower with the Kremlin clock
    tower(330, 20, 96, false);         // Senate tower
    tower(612, 18, 104, false);        // corner tower

    // Lenin's Mausoleum: stepped dark granite with a red band
    const mx = 170;
    rect(mx, GROUND - 22, 80, 22, C.dgrey);
    rect(mx, GROUND - 14, 80, 3, C.red);
    rect(mx + 10, GROUND - 30, 60, 8, C.dgrey);
    rect(mx + 20, GROUND - 36, 40, 6, C.grey);
    rect(mx + 28, GROUND - 44, 24, 8, C.dgrey);
    for (let x = mx + 30; x < mx + 50; x += 4) rect(x, GROUND - 43, 2, 6, C.black);
    rect(mx + 34, GROUND - 10, 12, 10, C.black);                  // entrance

    // St Basil's Cathedral
    const bx = 420;
    rect(bx, GROUND - 40, 110, 40, C.lred);
    for (let x = bx + 4; x < bx + 106; x += 10) {
      rect(x, GROUND - 32, 4, 8, C.white);
      rect(x + 1, GROUND - 30, 2, 6, C.black);
    }
    rect(bx, GROUND - 40, 110, 2, C.white);
    // central tent tower
    rect(bx + 47, GROUND - 76, 16, 36, C.lred);
    rect(bx + 47, GROUND - 76, 16, 2, C.white);
    tri(bx + 55, GROUND - 112, GROUND - 76, 9, C.yellow);
    for (let y = GROUND - 104; y < GROUND - 78; y += 6) rect(bx + 50, y, 10, 1, C.green);
    rect(bx + 55, GROUND - 118, 1, 6, C.yellow);
    onion(bx + 55, GROUND - 124, 0.9, C.yellow, C.orange, GROUND - 112);
    // surrounding domes
    onion(bx + 14, GROUND - 76, 1.5, C.green, C.yellow, GROUND - 40);
    onion(bx + 34, GROUND - 94, 1.8, C.red, C.white, GROUND - 40);
    onion(bx + 76, GROUND - 96, 1.8, C.cyan, C.yellow, GROUND - 40);
    onion(bx + 96, GROUND - 76, 1.5, C.purple, C.lgreen, GROUND - 40);
  })();

  // ---- Level 2 backdrop: the Gulag (barracks, watchtowers, barbed wire) ----
  const BG2 = document.createElement('canvas');
  BG2.width = BG_W; BG2.height = H;
  const TOWERS2 = [250, 560];          // watchtower x positions (for searchlights)
  let bg2Painted = false;
  function paintGulag() {
    if (bg2Painted) return;
    bg2Painted = true;
    const g = BG2.getContext('2d');
    const rect = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
    // snowy pines in the distance
    for (let x = 4; x < BG_W; x += 13) {
      const h = 26 + ((x * 37) % 22), base = GROUND - 18;
      for (let y = 0; y < h; y++) {
        const hw = Math.max(1, Math.round((y / h) * 7));
        rect(x - hw, base - h + y, hw * 2, 1, (y % 6 === 0) ? C.lgrey : C.dgrey);
      }
      rect(x - 1, base, 2, 4, C.brown);
    }
    // barracks with snowy roofs and lit windows
    for (const [bx, bw] of [[24, 150], [360, 150]]) {
      rect(bx, GROUND - 30, bw, 30, C.brown);
      for (let y = GROUND - 26; y < GROUND; y += 5) rect(bx, y, bw, 1, C.orange);
      rect(bx - 4, GROUND - 34, bw + 8, 4, C.white);
      rect(bx, GROUND - 38, bw, 4, C.white);
      for (let x = bx + 8; x < bx + bw - 8; x += 18) { rect(x, GROUND - 22, 6, 6, C.yellow); rect(x + 2, GROUND - 22, 1, 6, C.brown); }
      rect(bx + 20, GROUND - 48, 6, 10, C.dgrey);
    }
    // watchtowers
    for (const tx of TOWERS2) {
      rect(tx - 10, GROUND - 70, 2, 70, C.brown);
      rect(tx + 8, GROUND - 70, 2, 70, C.brown);
      for (let y = GROUND - 66; y < GROUND; y += 16)
        for (let i = 0; i < 16; i++) rect(tx - 8 + i, y + i, 1, 1, C.orange);
      rect(tx - 14, GROUND - 90, 28, 20, C.brown);
      rect(tx - 12, GROUND - 86, 24, 5, C.black);
      rect(tx - 16, GROUND - 72, 32, 2, C.orange);
      for (let y = 0; y < 10; y++) rect(tx - 16 + y * 1.6, GROUND - 100 + y, 32 - y * 3.2, 1, C.white);
      rect(tx - 3, GROUND - 86, 6, 4, C.yellow);                 // searchlight lamp
    }
    // camp sign
    rect(278, GROUND - 68, 2, 68, C.brown); rect(364, GROUND - 68, 2, 68, C.brown);
    rect(268, GROUND - 70, 108, 14, C.white);
    g.font = '8px "Press Start 2P", monospace'; g.textAlign = 'center'; g.fillStyle = C.black;
    g.fillText('ЗА КОММУНИЗМ', 322, GROUND - 59);
    // barbed-wire fence
    for (let x = 6; x < BG_W; x += 32) { rect(x, GROUND - 46, 3, 46, C.brown); rect(x - 3, GROUND - 48, 4, 2, C.brown); }
    for (const wy of [GROUND - 42, GROUND - 32, GROUND - 22, GROUND - 12]) {
      rect(0, wy, BG_W, 1, C.lgrey);
      for (let x = (wy % 8); x < BG_W; x += 8) { rect(x, wy - 1, 1, 3, C.lgrey); rect(x - 1, wy, 3, 1, C.white); }
    }
  }
  const snow = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, v: 0.3 + Math.random() * 0.7 }));

  const LEVELS = [
    { name: 'RED SQUARE', end: 500 },
    { name: 'GULAG', end: 1000 },
  ];
  const SPEED = 4.2;                    // constant: the game no longer speeds up

  const groundBits = Array.from({ length: 40 }, () => ({
    x: Math.random() * W, y: GROUND + 4 + Math.floor(Math.random() * 20), w: 1 + Math.floor(Math.random() * 3)
  }));

  // ---- Game state ----
  const STATE = { TITLE: 0, PLAY: 1, OVER: 2, CLEAR: 3, WIN: 4 };
  let state = STATE.TITLE;
  let level = 1, levelStart = { score: 0, stars: 0 }, banner = 0;
  let player, obstacles, stars, popups, horses, corpses, starCount, speed, score, nextSpawn, skyOff, frame, flash, overTimer, blink;

  // Start (or restart) a level; score and stars carry over from where the level began
  function reset(lv = 1) {
    if (lv === 1) levelStart = { score: 0, stars: 0 };
    level = lv;
    if (lv === 2) paintGulag();
    banner = 150;
    player = { x: 28, y: GROUND - 36, vy: 0, w: 24, h: 36, onGround: true, riding: false, invuln: 0 };
    horses = [];
    corpses = [];
    obstacles = [];
    stars = [];
    popups = [];
    starCount = levelStart.stars;
    speed = SPEED;
    score = levelStart.score;
    nextSpawn = 80;
    skyOff = lv === 1 ? 150 : 0;
    frame = 0;
    flash = 0;
  }
  reset();

  // Horse riding changes Lenin's size; keep his feet where they are
  function setRiding(on) {
    const bottom = player.y + player.h;
    player.riding = on;
    player.w = on ? 44 : 24;
    player.h = on ? 42 : 36;
    player.y = bottom - player.h;
  }

  function addStar(x, y) {
    stars.push({ x, y, w: 22, h: 18, t: Math.random() * 60 });
  }

  const HORSE_SCORE = 150;
  function spawn() {
    const r = Math.random();
    const x0 = W + 10;
    let width = 30, height = 30;
    if (score > 100 && r < 0.28) {
      // Marching Bolshevik(s), walking toward Lenin
      const n = score > 400 && Math.random() < 0.35 ? 2 : 1;
      for (let i = 0; i < n; i++)
        obstacles.push({ type: 'bol', x: x0 + i * 30, y: GROUND - 40, w: 28, h: 40, t: Math.random() * 12, shooter: i === 0 && Math.random() < 0.45 });
      width = n * 30; height = 40;
    } else if (r < 0.6) {
      obstacles.push({ type: 'hs', x: x0, y: GROUND - 30, w: 30, h: 30, spr: SPR.hsSmall });
    } else if (r < 0.82) {
      const n = score > 150 ? 2 + (Math.random() < 0.4 ? 1 : 0) : 2;
      for (let i = 0; i < n; i++)
        obstacles.push({ type: 'hs', x: x0 + i * 26, y: GROUND - 30, w: 30, h: 30, spr: SPR.hsSmall });
      width = n * 26 + 4;
    } else {
      obstacles.push({ type: 'hs', x: x0, y: GROUND - 45, w: 45, h: 45, spr: SPR.hsBig });
      width = 45; height = 45;
    }
    // Red star floating above the obstacle: grab it mid-jump
    if (Math.random() < 0.4) addStar(x0 + width / 2 - 11, GROUND - height - 34);

    const minGap = 110 + speed * 14;
    nextSpawn = minGap + Math.random() * 160;
    // Red star on the ground in the gap before the next obstacle
    const gapMid = x0 + width + nextSpawn * 0.5;
    if (!player.riding && horses.length === 0 && score > HORSE_SCORE && Math.random() < 0.2) {
      // A riderless horse waits in the gap: run into it to mount
      horses.push({ x: gapMid - 22, y: GROUND - 32, w: 44, h: 32, t: 0 });
    } else if (Math.random() < 0.35) addStar(gapMid, GROUND - 22);
  }

  // ---- Input ----
  let holding = false;
  function press() {
    audio();
    if (state === STATE.TITLE) { reset(1); state = STATE.PLAY; return; }
    if (state === STATE.OVER) { if (overTimer > 25) { reset(level); state = STATE.PLAY; } return; }
    if (state === STATE.CLEAR) {
      if (overTimer > 40) {
        levelStart = { score: LEVELS[level - 1].end, stars: starCount };
        const riding = player.riding;
        reset(level + 1);
        if (riding) setRiding(true);   // keep the horse into the next level
        state = STATE.PLAY;
      }
      return;
    }
    if (state === STATE.WIN) { if (overTimer > 40) state = STATE.TITLE; return; }
    holding = true;
    if (player.onGround) {
      player.vy = -8.6;
      player.onGround = false;
      sfx.jump();
    }
  }
  function release() {
    holding = false;
    if (state === STATE.PLAY && player.vy < -3.5) player.vy = -3.5; // short hop
  }
  addEventListener('keydown', e => {
    if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) {
      e.preventDefault();
      if (!e.repeat) press();
    }
  });
  addEventListener('keyup', e => {
    if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) release();
  });
  addEventListener('pointerdown', e => { e.preventDefault(); press(); });
  addEventListener('pointerup', release);
  addEventListener('pointercancel', release);

  // ---- Update ----
  function hit(a, b) {
    // Forgiving hitboxes
    return a.x + 5 < b.x + b.w - 6 && a.x + a.w - 5 > b.x + 6 &&
           a.y + 4 < b.y + b.h - 4 && a.y + a.h - 2 > b.y + 6;
  }

  function update(dt) {
    blink += dt;
    for (const f of snow) {                // snowfall (drawn in the Gulag only)
      f.y += f.v * dt; f.x -= (state === STATE.PLAY ? speed * 0.4 : 0.3) * dt;
      if (f.y > H) { f.y = -2; f.x = Math.random() * W; }
      if (f.x < 0) f.x += W;
    }
    if (state === STATE.OVER || state === STATE.CLEAR || state === STATE.WIN) { overTimer += dt; return; }
    if (state !== STATE.PLAY) return;
    frame += dt;
    if (banner > 0) banner -= dt;

    const move = speed * dt;

    // player physics
    if (!player.onGround) {
      player.vy += (holding && player.vy < 0 ? 0.42 : 0.62) * dt;
      player.y += player.vy * dt;
      if (player.y >= GROUND - player.h) {
        player.y = GROUND - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }

    // world scroll
    skyOff = (skyOff + move * 0.35) % BG_W;
    for (const g of groundBits) {
      g.x -= move;
      if (g.x < -4) { g.x = W + Math.random() * 20; g.y = GROUND + 4 + Math.floor(Math.random() * 20); }
    }

    nextSpawn -= move;
    if (nextSpawn <= 0) spawn();

    const shots = [];
    for (const o of obstacles) {
      if (o.type === 'bullet') { o.x -= move + 4.5 * dt; continue; }
      if (o.flash > 0) o.flash -= dt;
      // Some Bolsheviks stop, take aim and fire one shot at Lenin
      if (o.shooter && o.aim === undefined && o.x < W - 60 && o.x - (player.x + player.w) > 100 &&
          !obstacles.some(q => q !== o && q.x < o.x && q.x + q.w > player.x)) o.aim = 0;   // only with a clear line of fire
      if (o.aim !== undefined && (!o.fired || o.flash > 0)) {
        o.x -= move;                       // standing still while aiming
        o.aim += dt;
        if (!o.fired && o.aim > 24) {
          o.fired = true;
          o.flash = 10;
          shots.push({ type: 'bullet', x: o.x - 22, y: GROUND - 26, w: 16, h: 14 });
          sfx.shot();
        }
        continue;
      }
      o.x -= move * (o.type === 'bol' ? 1.12 : 1);
      if (o.type === 'bol') o.t += dt;
    }
    obstacles.push(...shots);
    obstacles = obstacles.filter(o => o.x + o.w > -10);

    // red stars: collect for bonus points
    for (const st of stars) {
      st.x -= move;
      st.t += dt;
      if (!st.got && player.x + 2 < st.x + st.w && player.x + player.w - 2 > st.x &&
          player.y < st.y + st.h && player.y + player.h > st.y) {
        st.got = true;
        starCount++;
        score += 25;
        sfx.coin();
        popups.push({ x: st.x + 11, y: st.y, t: 0 });
      }
    }
    stars = stars.filter(st => !st.got && st.x + st.w > -10);
    for (const pp of popups) { pp.t += dt; pp.y -= 0.5 * dt; }
    popups = popups.filter(pp => pp.t < 40);

    for (const hs of horses) {
      hs.x -= move;
      hs.t += dt;
      if (!player.riding && hit(player, hs)) {
        hs.taken = true;
        setRiding(true);
        sfx.mount();
        popups.push({ x: hs.x + 22, y: hs.y - 6, t: 0, label: 'HORSE!' });
      }
    }
    horses = horses.filter(hs => !hs.taken && hs.x + hs.w > -10);
    for (const c of corpses) c.x -= move;
    corpses = corpses.filter(c => c.x > -50);
    if (player.invuln > 0) player.invuln -= dt;

    for (const o of obstacles) {
      // Landing on a Bolshevik's head knocks him flat and bounces Lenin back up
      if (o.type === 'bol' && player.vy > 0 &&
          player.x + player.w - 6 > o.x + 4 && player.x + 6 < o.x + o.w - 4 &&
          player.y + player.h >= o.y - 2 && player.y + player.h <= o.y + 18) {
        o.crushed = true;
        corpses.push({ x: o.x, y: GROUND - 12, spr: SPR.bolSquash });
        player.vy = holding ? -8 : -6;
        player.onGround = false;
        score += 50;
        sfx.stomp();
        popups.push({ x: o.x + 14, y: o.y - 4, t: 0, label: '+50' });
        continue;
      }
      if (player.invuln > 0 || !hit(player, o)) continue;
      if (player.riding) {
        // The horse takes the hit: it dies, the obstacle is crushed, Lenin keeps going
        o.crushed = true;
        corpses.push({ x: player.x, y: GROUND - 30 });
        setRiding(false);
        player.vy = -6;
        player.onGround = false;
        player.invuln = 70;
        sfx.neigh();
        popups.push({ x: player.x + 30, y: GROUND - 36, t: 0, label: 'RIP HORSE' });
        continue;
      }
      {
        state = STATE.OVER;
        overTimer = 0;
        if (Math.floor(score) > hi) { hi = Math.floor(score); saveHi(); }
        sfx.die();
        return;
      }
    }
    obstacles = obstacles.filter(o => !o.crushed);

    const before = Math.floor(score / 100);
    score += 0.2 * dt;
    if (Math.floor(score / 100) > before) { sfx.point(); flash = 40; }
    if (flash > 0) flash -= dt;

    // Reaching the level's last line ends the level
    if (score >= LEVELS[level - 1].end) {
      score = LEVELS[level - 1].end;
      state = level < LEVELS.length ? STATE.CLEAR : STATE.WIN;
      overTimer = 0;
      if (score > hi) { hi = score; saveHi(); }
      sfx.fanfare();
    }
  }

  // ---- Draw ----
  function text(str, x, y, color = C.lblue, align = 'left') {
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.fillText(str, x, y);
  }
  const pad5 = n => String(Math.floor(n)).padStart(5, '0');

  function drawWorld() {
    if (level === 2) return drawGulag();
    ctx.fillStyle = C.blue;
    ctx.fillRect(0, 0, W, H);

    // big pale moon
    ctx.fillStyle = '#5848A8';
    ctx.fillRect(250, 30, 24, 24);
    ctx.fillRect(246, 34, 32, 16);
    ctx.fillRect(254, 26, 16, 32);

    // Red Square backdrop (two copies for seamless wrap)
    const bx = Math.floor(-skyOff);
    ctx.drawImage(BG, bx, 0);
    ctx.drawImage(BG, bx + BG_W, 0);

    // ground
    // cobblestones
    ctx.fillStyle = C.dgrey;
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = C.lgrey;
    ctx.fillRect(0, GROUND, W, 2);
    ctx.fillStyle = C.grey;
    for (const g of groundBits) ctx.fillRect(Math.floor(g.x), g.y, g.w, 1);
  }

  function drawGulag() {
    ctx.fillStyle = C.black;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = C.dgrey;                       // cold moon
    ctx.fillRect(60, 28, 16, 16); ctx.fillRect(56, 32, 24, 8); ctx.fillRect(64, 24, 8, 24);
    const bx = Math.floor(-skyOff);
    // sweeping searchlight beams
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = C.yellow;
    TOWERS2.forEach((tx, i) => {
      for (const off of [bx, bx + BG_W]) {
        const lx = tx + off, ly = GROUND - 84;
        if (lx < -200 || lx > W + 200) continue;
        const aim = lx + Math.sin(blink / 50 + i * 2) * 90;
        ctx.beginPath();
        ctx.moveTo(lx, ly); ctx.lineTo(aim - 22, GROUND); ctx.lineTo(aim + 22, GROUND);
        ctx.fill();
      }
    });
    ctx.restore();
    ctx.drawImage(BG2, bx, 0);
    ctx.drawImage(BG2, bx + BG_W, 0);
    // snow on the ground
    ctx.fillStyle = C.white;
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = C.lgrey;
    ctx.fillRect(0, GROUND, W, 1);
    for (const g of groundBits) ctx.fillRect(Math.floor(g.x), g.y, g.w, 1);
  }

  function drawSnow() {
    if (level !== 2) return;
    ctx.fillStyle = C.white;
    for (const f of snow) ctx.fillRect(Math.floor(f.x), Math.floor(f.y), f.v > 0.7 ? 2 : 1, f.v > 0.7 ? 2 : 1);
  }

  function drawHorses() {
    for (const c of corpses) ctx.drawImage(c.spr || SPR.horseDead, Math.floor(c.x), c.y);
    for (const hs of horses) {
      // grazing: head dips now and then
      const dip = Math.floor(hs.t / 25) % 3 === 0 ? 2 : 0;
      ctx.drawImage(SPR.horseA, Math.floor(hs.x), Math.floor(hs.y) + dip);
    }
  }

  function drawPlayer() {
    if (player.invuln > 0 && state === STATE.PLAY && Math.floor(player.invuln / 4) % 2) return;
    if (player.riding) {
      const gallop = state === STATE.PLAY && player.onGround ? Math.floor(frame / 5) % 2 : 0;
      const bounce = gallop ? 1 : 0;
      ctx.drawImage(gallop ? SPR.horseB : SPR.horseA, Math.floor(player.x), Math.floor(player.y) + 10);
      ctx.drawImage(SPR.leninRide, Math.floor(player.x) + 10, Math.floor(player.y) - bounce);
      return;
    }
    let spr;
    if (state === STATE.OVER) spr = SPR.dead;
    else if (!player.onGround) spr = SPR.jump;
    else if (state === STATE.PLAY) spr = Math.floor(frame / 6) % 2 ? SPR.runA : SPR.runB;
    else spr = SPR.runA;
    ctx.drawImage(spr, Math.floor(player.x), Math.floor(player.y));
  }

  function drawObstacles() {
    for (const o of obstacles) {
      const x = Math.floor(o.x), y = Math.floor(o.y);
      if (o.type === 'bullet') {
        ctx.fillStyle = C.lgrey; ctx.fillRect(x + 8, y + 7, 10, 1);   // smoke trail
        ctx.fillStyle = C.white; ctx.fillRect(x + 4, y + 6, 6, 3);
        ctx.fillStyle = C.yellow; ctx.fillRect(x + 2, y + 6, 2, 3);
        continue;
      }
      if (o.type === 'bol' && o.aim !== undefined && (!o.fired || o.flash > 0)) {
        ctx.drawImage(SPR.bolAim, x - 8, y);
        if (o.flash > 0) {                                           // muzzle flash
          ctx.fillStyle = C.yellow; ctx.fillRect(x - 16, y + 18, 6, 6);
          ctx.fillStyle = C.white; ctx.fillRect(x - 14, y + 20, 3, 2);
        } else if (Math.floor(o.aim / 4) % 2) {                      // warning "!"
          text('!', x + 14, y - 4, C.yellow, 'center');
        }
        continue;
      }
      const spr = o.type === 'bol' ? (Math.floor(o.t / 7) % 2 ? SPR.bolA : SPR.bolB) : o.spr;
      ctx.drawImage(spr, x, y);
    }
  }

  function drawStars() {
    for (const st of stars) {
      // twinkle: blink a white glint
      const bob = Math.round(Math.sin(st.t / 8) * 2);
      ctx.drawImage(SPR.star, Math.floor(st.x), Math.floor(st.y) + bob);
      if (Math.floor(st.t / 10) % 4 === 0) {
        ctx.fillStyle = C.white;
        ctx.fillRect(Math.floor(st.x) + 10, Math.floor(st.y) + bob + 4, 2, 2);
      }
    }
    for (const pp of popups) text(pp.label || '+25', Math.floor(pp.x), Math.floor(pp.y), pp.label === 'RIP HORSE' ? C.lgrey : C.yellow, 'center');
  }

  function drawHUD() {
    const showScore = !(flash > 0 && Math.floor(flash / 5) % 2);
    ctx.drawImage(SPR.starIcon, 8, 6);
    text('x' + starCount, 22, 14, C.white);
    text('LV' + level, 60, 14, C.yellow);
    // progress through the level toward its last line
    const L = LEVELS[level - 1], from = level === 1 ? 0 : LEVELS[level - 2].end;
    const prog = Math.max(0, Math.min(1, (score - from) / (L.end - from)));
    ctx.fillStyle = C.dgrey; ctx.fillRect(8, 20, W - 16, 2);
    ctx.fillStyle = C.yellow; ctx.fillRect(8, 20, Math.floor((W - 16) * prog), 2);
    if (banner > 0 && state === STATE.PLAY) {
      text('LEVEL ' + level + ': ' + L.name, W / 2, 50, C.yellow, 'center');
      text('REACH LINE ' + L.end, W / 2, 64, C.white, 'center');
    }
    text('HI ' + pad5(hi), 196, 14, C.lgrey, 'right');
    if (showScore) text(pad5(score), 312, 14, C.white, 'right');
  }

  function drawTitle() {
    text('**** PROLETARIAT 64 BASIC V2 ****', W / 2, 20, C.lblue, 'center');
    text('64K RAM SYSTEM  1917 BYTES FREE', W / 2, 34, C.lblue, 'center');
    text('READY.', 8, 54, C.lblue);
    text('LOAD "LENIN JUMP",8,1', 8, 66, C.lblue);
    text('LENIN JUMP', W / 2, 98, C.yellow, 'center');
    if (Math.floor(blink / 30) % 2 === 0)
      text('PRESS SPACE / TAP TO START', W / 2, 116, C.white, 'center');
    text('REACH LINE 500 TO CLEAR A LEVEL', W / 2, 132, C.lgreen, 'center');
    text('JUMP HAMMERS, STOMP BOLSHEVIKS', W / 2, 184, C.lgrey, 'center');
    text('GRAB THE RED STARS: +25', W / 2, 196, C.lred, 'center');
  }

  function drawOver() {
    ctx.fillStyle = C.black;
    ctx.fillRect(56, 72, 208, 46);
    ctx.fillStyle = C.lblue;
    ctx.fillRect(56, 72, 208, 2); ctx.fillRect(56, 116, 208, 2);
    text('?REVOLUTION ERROR', W / 2, 88, C.red, 'center');
    text('IN LINE ' + Math.floor(score), W / 2, 100, C.lblue, 'center');
    if (overTimer > 25 && Math.floor(blink / 30) % 2 === 0)
      text('SPACE / TAP TO RETRY', W / 2, 112, C.white, 'center');
  }

  function box(lines) {
    const h = 16 + lines.length * 12;
    const y0 = 60;
    ctx.fillStyle = C.black;
    ctx.fillRect(40, y0, 240, h);
    ctx.fillStyle = C.lblue;
    ctx.fillRect(40, y0, 240, 2); ctx.fillRect(40, y0 + h - 2, 240, 2);
    lines.forEach(([t, c], i) => { if (t) text(t, W / 2, y0 + 16 + i * 12, c, 'center'); });
  }
  function drawClear() {
    const ready = overTimer > 40 && Math.floor(blink / 30) % 2 === 0;
    if (state === STATE.CLEAR) box([
      ['LEVEL ' + level + ' COMPLETE', C.yellow],
      [LEVELS[level - 1].name + ' CLEARED', C.lgreen],
      ['NEXT STOP: ' + LEVELS[level].name, C.lred],
      [ready ? 'SPACE / TAP TO GO ON' : '', C.white],
    ]);
    else box([
      ['LENIN ESCAPED THE GULAG!', C.yellow],
      ['THE END', C.lgreen],
      ['STARS: ' + starCount + '  LINES: ' + Math.floor(score), C.lblue],
      [ready ? 'SPACE / TAP: MAIN MENU' : '', C.white],
    ]);
  }

  function draw() {
    ctx.font = '8px "Press Start 2P", monospace';
    ctx.textBaseline = 'alphabetic';
    drawWorld();
    drawHorses();
    drawObstacles();
    drawStars();
    drawPlayer();
    drawSnow();
    if (state !== STATE.TITLE) drawHUD();
    if (state === STATE.CLEAR || state === STATE.WIN) drawClear();
    if (state === STATE.TITLE) drawTitle();
    if (state === STATE.OVER) drawOver();
  }

  // ---- Main loop (dt in 60fps frames) ----
  let last = performance.now();
  blink = 0; overTimer = 0;
  function loop(now) {
    const dt = Math.min(3, (now - last) / (1000 / 60));
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  const start = () => requestAnimationFrame(t => { last = t; loop(t); });
  if (document.fonts && document.fonts.load) {
    // also fetch the Cyrillic glyphs used on the Gulag sign
    Promise.all([document.fonts.load('8px "Press Start 2P"'), document.fonts.load('8px "Press Start 2P"', 'ЗА КОММУНИЗМ')]).then(start, start);
  } else start();
})();
</script>
</body>
</html>
